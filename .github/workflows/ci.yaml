name: Build Demo CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Simulate a production deploy
        run: echo "Deploying to production now that a human has approved this run."
